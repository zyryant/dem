<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Roboto, Arial, sans-serif">
  <rect width="900" height="560" fill="#f5f7f8"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#343A40">ER-диаграмма базы данных</text>

  <!-- defs -->
  <defs>
    <marker id="one" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M7,1 V13" stroke="#007bff" stroke-width="2"/>
    </marker>
    <marker id="many" markerWidth="16" markerHeight="16" refX="2" refY="8" orient="auto">
      <path d="M14,2 L2,8 L14,14" fill="none" stroke="#007bff" stroke-width="2"/>
    </marker>
  </defs>

  <!-- relations (draw behind boxes) -->
  <g stroke="#007bff" stroke-width="2" fill="none">
    <!-- users -> requests -->
    <path d="M250,150 H360" marker-start="url(#one)" marker-end="url(#many)"/>
    <!-- items -> requests -->
    <path d="M650,430 V300 H540" marker-start="url(#one)" marker-end="url(#many)"/>
    <!-- requests -> reviews -->
    <path d="M450,360 V430" marker-start="url(#one)" marker-end="url(#one)"/>
    <!-- users -> reviews -->
    <path d="M150,300 V470 H230" marker-start="url(#one)" marker-end="url(#many)"/>
  </g>

  <!-- USERS -->
  <g>
    <rect x="40" y="110" width="210" height="150" rx="10" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <rect x="40" y="110" width="210" height="32" rx="10" fill="#007bff"/>
    <text x="145" y="131" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">users</text>
    <text x="56" y="162" font-size="13" fill="#343A40">🔑 id (PK)</text>
    <text x="56" y="184" font-size="13" fill="#343A40">login (UNIQUE)</text>
    <text x="56" y="206" font-size="13" fill="#343A40">password, fio</text>
    <text x="56" y="228" font-size="13" fill="#343A40">phone, email</text>
    <text x="56" y="250" font-size="13" fill="#343A40">birthdate, created_at</text>
  </g>

  <!-- REQUESTS -->
  <g>
    <rect x="360" y="110" width="200" height="170" rx="10" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <rect x="360" y="110" width="200" height="32" rx="10" fill="#007bff"/>
    <text x="460" y="131" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">requests</text>
    <text x="376" y="162" font-size="13" fill="#343A40">🔑 id (PK)</text>
    <text x="376" y="184" font-size="13" fill="#343A40">🔗 user_id (FK)</text>
    <text x="376" y="206" font-size="13" fill="#343A40">🔗 item_id (FK)</text>
    <text x="376" y="228" font-size="13" fill="#343A40">event_date, payment</text>
    <text x="376" y="250" font-size="13" fill="#343A40">status</text>
    <text x="376" y="272" font-size="13" fill="#343A40">created_at</text>
  </g>

  <!-- ITEMS -->
  <g>
    <rect x="540" y="430" width="220" height="120" rx="10" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <rect x="540" y="430" width="220" height="32" rx="10" fill="#007bff"/>
    <text x="650" y="451" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">items</text>
    <text x="556" y="482" font-size="13" fill="#343A40">🔑 id (PK)</text>
    <text x="556" y="504" font-size="13" fill="#343A40">category, title</text>
    <text x="556" y="526" font-size="13" fill="#343A40">image, capacity, price</text>
  </g>

  <!-- REVIEWS -->
  <g>
    <rect x="230" y="430" width="210" height="120" rx="10" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <rect x="230" y="430" width="210" height="32" rx="10" fill="#007bff"/>
    <text x="335" y="451" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">reviews</text>
    <text x="246" y="482" font-size="13" fill="#343A40">🔑 id (PK)</text>
    <text x="246" y="504" font-size="13" fill="#343A40">🔗 request_id (FK, UNIQUE)</text>
    <text x="246" y="526" font-size="13" fill="#343A40">🔗 user_id (FK), rating, comment</text>
  </g>

  <text x="280" y="140" font-size="12" fill="#0d47a1">1 : ∞</text>
  <text x="560" y="295" font-size="12" fill="#0d47a1">1 : ∞</text>
  <text x="458" y="400" font-size="12" fill="#0d47a1">1 : 1</text>
  <text x="160" y="455" font-size="12" fill="#0d47a1">1 : ∞</text>
</svg>
